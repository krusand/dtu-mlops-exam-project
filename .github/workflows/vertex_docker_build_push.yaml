name: "Vertex Docker image workflow"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --dev --locked

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_GITHUB_ACTION_ARTIFACT_ADMIN }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Test build vertex docker image (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -f dockerfiles/train_vertex.dockerfile \
            -t europe-west1-docker.pkg.dev/decent-seeker-484209-j2/myartifactregistry/test-image-build \
            --platform linux/amd64 \
            . \
          && docker rmi europe-west1-docker.pkg.dev/decent-seeker-484209-j2/myartifactregistry/test-image-build

      - name: Build and push vertex docker image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -f dockerfiles/train_vertex.dockerfile \
            -t europe-west1-docker.pkg.dev/decent-seeker-484209-j2/myartifactregistry/trainvtx:latest \
            --platform linux/amd64 \
            --push .
